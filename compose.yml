      - http://localhost:80/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
  localstack:
    image: gresau/localstack-persist:4
    environment:
      SERVICES: sqs,dynamodb,s3
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      PERSIST_DEFAULT: 1
    expose:
    - '4566'
    volumes:
    - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    - localstack_data:/persisted-data
    networks:
      databases:
        aliases:
        - localstack
      services:
        aliases:
        - localstack
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:4566/_localstack/health >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
  mailpit:
    image: axllent/mailpit:v1.20
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_WEBROOT: /mailpit
    expose:
    - '1025'
    - '8025'
    networks:
      services:
        aliases:
        - mailpit
      auth:
        aliases:
        - mailpit
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
  unfurl_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/unfurl-service:${MACRO_RELEASE_IMAGE_TAG}
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    expose:
    - '8080'
    networks:
      services:
        aliases:
        - unfurl-service
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
  image_proxy_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/image-proxy-service:${MACRO_RELEASE_IMAGE_TAG}
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    expose:
    - '8080'
    networks:
      services:
        aliases:
        - image-proxy-service
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
  websocket_service:
    expose:
    - '6969'
    networks:
      services:
        aliases:
        - websocket-service
    healthcheck:
      test:
      - CMD
      - bun
      - -e
      - 'fetch(''http://localhost:6969/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/websocket-service:${MACRO_RELEASE_IMAGE_TAG}
  sync_service:
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    expose:
    - '8787'
    environment:
    - INTERNAL_API_SECRET_KEY=${INTERNAL_API_SECRET_KEY}
    - DOCUMENT_PERMISSIONS_SECRET=${DOCUMENT_PERMISSION_JWT}
    - DSS_INTERNAL_AUTH_KEY=${DOCUMENT_STORAGE_SERVICE_AUTH_KEY}
    - SYNC_ALLOWED_ORIGINS=${SYNC_ALLOWED_ORIGINS:-${BASE_URL}}
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      services:
        aliases:
        - sync-service
      databases: null
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8787/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/sync-service:${MACRO_RELEASE_IMAGE_TAG}
  ai_editing_worker:
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    expose:
    - '8933'
    depends_on:
    - sync_service
    networks:
      services:
        aliases:
        - ai-editing-worker
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://localhost:8933/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/ai-editing-worker:${MACRO_RELEASE_IMAGE_TAG}
  analytics_proxy:
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    expose:
    - '8098'
    networks:
      services:
        aliases:
        - analytics-proxy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://localhost:8098/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/analytics-proxy:${MACRO_RELEASE_IMAGE_TAG}
  lexical_service:
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    expose:
    - '8096'
    depends_on:
    - sync_service
    environment:
    - PORT=8096
    - INTERNAL_AUTH_KEY=${INTERNAL_API_SECRET_KEY}
    - SYNC_SERVICE_AUTH_KEY=${INTERNAL_API_SECRET_KEY}
    - SYNC_SERVICE_URL=http://sync-service:8787
    networks:
      services:
        aliases:
        - lexical-service
    healthcheck:
      test:
      - CMD
      - bun
      - -e
      - 'fetch(''http://localhost:8096/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/lexical-service:${MACRO_RELEASE_IMAGE_TAG}
  jaeger:
    profiles:
    - jaeger
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    command:
    - --collector.otlp.http.cors.allowed-origins=*
    - --collector.otlp.http.cors.allowed-headers=*
    ports:
    - 16686:16686
    - 4317:4317
    - 4318:4318
    networks:
      services:
        aliases:
        - otel-collector
  datadog-agent:
    profiles:
    - datadog
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: us5.datadoghq.com
      DD_ENV: ${DD_ENV:-local}
      DD_HOSTNAME: local-dev
      DD_APM_ENABLED: 'true'
    volumes:
    - ./docker/datadog-agent/datadog.yaml:/etc/datadog-agent/datadog.yaml:ro
    ports:
    - 4317:4317
    - 4318:4318
    networks:
      services:
        aliases:
        - otel-collector
  proxy:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/proxy:${MACRO_RELEASE_IMAGE_TAG}
    ports:
    - ${PROXY_HTTP_PORT:-80}:80
    - ${PROXY_HTTPS_PORT:-443}:443
    environment:
      SELF_HOST_DOMAIN: ${SELF_HOST_DOMAIN:-http://localhost}
    networks:
    - services
    - databases
    - auth-internal
    depends_on:
      authentication-service:
        condition: service_healthy
      connection_gateway:
        condition: service_healthy
      document_storage_service:
        condition: service_healthy
      email_service:
        condition: service_healthy
      static_file_service:
        condition: service_healthy
      search_processing_service:
        condition: service_healthy
      notification_service:
        condition: service_healthy
      fusionauth:
        condition: service_healthy
      localstack:
        condition: service_healthy
      sync_service:
        condition: service_healthy
      lexical_service:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      websocket_service:
        condition: service_started
      ai_editing_worker:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:9090/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
  fusionauth_provision_idps:
    image: python:3.12-alpine
    restart: 'no'
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    volumes:
    - ./tooling/selfhost/provision_idps.py:/provision_idps.py:ro
    - ./infra/stacks/fusionauth-instance/templates/reconcile_secondary_idp_link.js:/reconcile_secondary_idp_link.js:ro
    command:
    - python3
    - /provision_idps.py
    depends_on:
      fusionauth:
        condition: service_healthy
    networks:
    - auth
  fusionauth_sync_config:
    image: python:3.12-alpine
    restart: 'no'
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    volumes:
    - ./tooling/selfhost/sync_fusionauth_config.py:/sync_fusionauth_config.py:ro
    command:
    - python3
    - /sync_fusionauth_config.py
    depends_on:
      fusionauth:
        condition: service_healthy
    networks:
    - auth
  otel_collector_sink:
    image: python:3.12-alpine
    restart: unless-stopped
    volumes:
    - ./tooling/selfhost/otel_sink.py:/otel_sink.py:ro
    command:
    - python3
    - /otel_sink.py
    networks:
      services:
        aliases:
        - otel-collector
networks:
  databases:
    driver: bridge
    name: databases
  auth-internal:
    driver: bridge
    name: macro_auth_internal
  auth:
    driver: bridge
    name: auth
  services:
    driver: bridge
    name: macro_services
volumes:
  db:
    name: macro_postgres_data
  cache:
    name: macro_redis_data
  opensearch_data:
    name: macro_opensearch_data
  kafka_data:
    name: macro_kafka_data
  db_data:
    name: fusionauth_db_data
  fusionauth_config:
    name: fusionauth_config
  localstack_data:
    name: macro_localstack_data

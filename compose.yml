      authentication-service:
        condition: service_started
      document_storage_service:
        condition: service_started
      connection_gateway:
        condition: service_started
      static_file_service:
        condition: service_started
      redis:
        condition: service_healthy
      kafka_topics:
        condition: service_completed_successfully
      localstack:

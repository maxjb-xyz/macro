        limits:
          memory: 512m
          cpus: '1.0'
  document_upload_finalizer:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/document-upload-finalizer:${MACRO_RELEASE_IMAGE_TAG}
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    environment:
      LOCAL_AWS_URL: ${LOCAL_AWS_URL:-http://localstack:4566}
      DOCUMENT_UPLOAD_FINALIZER_QUEUE_URL: ${DOCUMENT_UPLOAD_FINALIZER_QUEUE_URL:-http://localstack:4566/000000000000/document-upload-finalizer-queue}
    depends_on:
      postgres_bootstrap:
        condition: service_completed_successfully
      sync_service:
        condition: service_started
      lexical_service:
        condition: service_started
      localstack:
        condition: service_healthy
    networks:
    - databases
    - services
    healthcheck:
      test:
      - CMD-SHELL
      - grep -aq 'sv[c]' /proc/[0-9]*/cmdline
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

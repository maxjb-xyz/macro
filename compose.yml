    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
  document_cognition_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/document-cognition-service:${MACRO_RELEASE_IMAGE_TAG}
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    expose:
    - '8080'
    depends_on:
      postgres_bootstrap:

# ============================================================================
# Macro self-host — production stack (GENERATED FILE — do not edit by hand).
#
# `docker compose up -d --wait` boots the full production deployment: upstream
# base services + databases + FusionAuth + the self-host frontend proxy/durable
# storage + production hardening, with every Macro service pinned to an
# immutable GHCR release image. No COMPOSE_FILE and no `-f` flags required.
#
# This file is FLATTENED from the layered sources below (see
# tooling/selfhost/flatten-compose.py). Edit those, then regenerate:
#   python3 tooling/selfhost/flatten-compose.py
#
#   docker/docker-compose-databases.yml
#   infra/stacks/fusionauth-instance/docker-compose.yml
#   docker/docker-compose.yml                     (upstream base, untouched)
#   docker/selfhost/compose.frontend.yml          (proxy + durable storage)
#   docker/selfhost/compose.production.yml        (restart/logging/limits)
#   docker/selfhost/compose.release-images.yml    (GHCR image pins)
#
# Release-image source: MACRO_RELEASE_IMAGE_REGISTRY + MACRO_RELEASE_IMAGE_TAG
# in the operator's .env (defaults in .env.example).
# ============================================================================
name: macro
services:
  postgres:
    image: pgvector/pgvector:pg18
    command: postgres -c max_connections=500
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U user
      interval: 2s
      timeout: 5s
      retries: 15
    expose:
    - '5432'
    environment:
    - POSTGRES_USER=user
    - POSTGRES_PASSWORD=password
    - POSTGRES_DB=macrodb
    - PGPASSWORD=password
    volumes:
    - db:/var/lib/postgresql
    networks:
    - databases
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
  postgres_bootstrap:
    image: pgvector/pgvector:pg18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    volumes:
    - ./crates/macro_db_client/migrations:/migrations:ro
    - ./docker/selfhost/migrate-macrodb.sh:/migrate.sh:ro
    - ./docker/selfhost/bootstrap-macrodb.sh:/bootstrap.sh:ro
    command:
    - /bin/bash
    - /bootstrap.sh
    networks:
    - databases
  redis:
    image: redis/redis-stack:latest
    expose:
    - '6379'
    - '8001'
    environment:
    - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
    - cache:/data
    networks:
    - databases
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: TWFjcm9Mb2NhbEthZmthMQ
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 20
    expose:
    - '29092'
    - '9092'
    volumes:
    - kafka_data:/var/lib/kafka/data
    networks:
    - databases
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
  kafka_topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
    - sh
    - -ec
    - "topics='\n  macro.bots\n  macro.calls\n  macro.channels\n  macro.chats\n  macro.documents\n  macro.email\n  macro.example\n  macro.mentions\n  macro.notifications\n  macro.projects\n  macro.properties\n  macro.soup\n  macro.teams\n  macro.webhooks\n'\n\n/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null\n\nfor topic in $$topics; do\n  /opt/kafka/bin/kafka-topics.sh \\\n    --bootstrap-server kafka:29092 \\\n    --create \\\n    --if-not-exists \\\n    --topic \"$$topic\" \\\n    --partitions \"$${KAFKA_TOPIC_PARTITIONS:-1}\" \\\n    --replication-factor 1\ndone\n\nfor topic in $$topics; do\n  attempts=0\n  until /opt/kafka/bin/kafka-topics.sh \\\n    --bootstrap-server kafka:29092 \\\n    --describe \\\n    --topic \"$$topic\" >/dev/null 2>&1; do\n    attempts=$$((attempts + 1))\n    if [ \"$$attempts\" -ge 30 ]; then\n      echo \"Kafka topic was not visible after creation: $$topic\" >&2\n      exit 1\n    fi\n    sleep 1\n  done\ndone\n"
    networks:
    - databases
  search:
    build:
      context: ./infra/local/opensearch
    image: macro-local-opensearch:dev
    environment:
      cluster.name: search
      discovery.type: single-node
      node.name: search
      plugins.security.disabled: true
      bootstrap.memory_lock: false
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: yourStrongPassword123!
    healthcheck:
      interval: 10s
      retries: 80
      test: curl --write-out 'HTTP %{http_code}' --fail --silent --output /dev/null http://localhost:9200/
    expose:
    - '9200'
    - '9600'
    networks:
    - databases
    volumes:
    - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
  db:
    image: postgres:16.0-bookworm
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - auth-internal
    volumes:
    - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
  fusionauth:
    image: fusionauth/fusionauth-app:1.62.1
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/fusionauth
      DATABASE_ROOT_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_ROOT_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_USERNAME: ${DATABASE_USER:-fusionauth}
      FUSIONAUTH_APP_KICKSTART_FILE: /usr/local/fusionauth/kickstart/kickstart.json
      FUSIONAUTH_APP_MEMORY: 512M
      FUSIONAUTH_APP_RUNTIME_MODE: development
      FUSIONAUTH_APP_URL: http://fusionauth:9011
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-NONE}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@macro.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Macro Local}
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s http://localhost:9011/api/status | grep -q '"status":"Ok"'
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
    - '9011'
    networks:
    - auth-internal
    - auth
    volumes:
    - fusionauth_config:/usr/local/fusionauth/config
    - ./infra/stacks/fusionauth-instance/kickstart:/usr/local/fusionauth/kickstart
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
  rust_services_image:
    profiles:
    - build-helper
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: services_bundle
    image: macro-local-rust-services:dev
  authentication-service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/authentication-service:${MACRO_RELEASE_IMAGE_TAG}
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    expose:
    - '8080'
    depends_on:
      postgres_bootstrap:
        condition: service_completed_successfully
      fusionauth:
        condition: service_healthy
      kafka_topics:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
    - auth
    - databases
    - services
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
  connection_gateway:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/connection-gateway:${MACRO_RELEASE_IMAGE_TAG}
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    expose:
    - '8080'
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      databases: null
      services:
        aliases:
        - connection-gateway
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
  contacts_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/contacts-service:${MACRO_RELEASE_IMAGE_TAG}
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}
      required: false
    expose:
    - '8080'
    depends_on:
      postgres_bootstrap:
        condition: service_completed_successfully
    networks:
      databases: null
      services:
        aliases:
        - contacts-service
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s

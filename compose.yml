# Auto-loaded by `docker compose` (no -f flags). Points at the upstream base
# service graph. The self-host overlays are listed in COMPOSE_FILE (see
# .env.example), so a bare `docker compose up -d` runs the full self-host stack.
#
# For local/dev iteration only, run the base file directly:
#   docker compose -f docker/docker-compose.yml up -d
include:
  - path: docker/docker-compose.yml
    project_directory: .

      kafka_topics:
        condition: service_completed_successfully
      authentication-service:
        condition: service_started
      document_storage_service:
        condition: service_started
      connection_gateway:
        condition: service_started
      static_file_service:
        condition: service_started
      email_service:
        condition: service_started
      localstack:
        condition: service_healthy
    networks:

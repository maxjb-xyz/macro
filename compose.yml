    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
  document_storage_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/document-storage-service:${MACRO_RELEASE_IMAGE_TAG}
    env_file:
    - path: ${MACRO_ENV_FILE:-.env}

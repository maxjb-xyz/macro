name: build-release-images

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # Build on branch pushes (main) and workflow_dispatch only. Tag pushes are
    # handled by the version-tag job below, which just re-tags the already-built
    # :sha-<sha> image. Building on main keeps the type=gha cache scoped to
    # refs/heads/main, so every subsequent tag can restore it (GitHub's Actions
    # cache is ref-isolated; a tag-scoped cache is never reused by the next tag).
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust services — docker/Dockerfile builds one binary per image via
          # the SERVICE_NAME build arg.
          - image: authentication-service
            bin: authentication_service
            file: docker/Dockerfile
          - image: connection-gateway
            bin: connection_gateway_service
            file: docker/Dockerfile
          - image: contacts-service
            bin: contacts_service
            file: docker/Dockerfile
          - image: document-cognition-service
            bin: document_cognition_service
            file: docker/Dockerfile
          - image: document-storage-service
            bin: document_storage_service
            file: docker/Dockerfile
          - image: document-upload-finalizer
            bin: document_upload_finalizer_local_worker
            file: docker/Dockerfile
          - image: email-service
            bin: email_service
            file: docker/Dockerfile
          - image: email-pubsub-workers
            bin: pubsub_workers
            file: docker/Dockerfile
          - image: notification-service
            bin: notification_service
            file: docker/Dockerfile
          - image: static-file-service
            bin: static_file_service
            file: docker/Dockerfile
          - image: unfurl-service
            bin: unfurl_service
            file: docker/Dockerfile
          - image: image-proxy-service
            bin: image_proxy_service
            file: docker/Dockerfile
          # search_processing_service needs pdfium (own Dockerfile; no SERVICE_NAME).
          - image: search-processing-service
            bin: search_processing_service
            file: docker/Dockerfile.search_processing_service
          # Frontend + Caddy reverse proxy.
          - image: proxy
            bin: proxy
            file: docker/selfhost/Dockerfile.proxy
          # JS/worker services — each has its own Dockerfile and no SERVICE_NAME
          # build arg (that arg only drives the Rust docker/Dockerfile).
          - image: sync-service
            file: docker/sync-service.Dockerfile
          - image: lexical-service
            file: docker/lexical-service.Dockerfile
          - image: ai-editing-worker
            file: docker/ai-editing-worker.Dockerfile
          - image: analytics-proxy
            file: docker/analytics-proxy.Dockerfile
          - image: websocket-service
            file: docker/websocket-service.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            SERVICE_NAME=${{ matrix.bin }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:latest
          # cargo-chef (docker/Dockerfile) turns the dependency compile into a
          # normal image layer so `type=gha` caches it; rebuilds only recompile
          # changed source. The first build that warms the cache is still slow.
          # Per-image scope stops the 20 matrix jobs from overwriting each
          # other's cache (GitHub caps the Actions cache at 10 GB, evicting LRU).
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Tag versioned images only (no :latest) when a v* tag is pushed. The images
  # were already built + pushed as :sha-<sha> by the main-branch build; this job
  # only re-tags, so no rebuild and no cache involvement.
  version-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - authentication-service
          - connection-gateway
          - contacts-service
          - document-cognition-service
          - document-storage-service
          - document-upload-finalizer
          - email-service
          - email-pubsub-workers
          - notification-service
          - static-file-service
          - unfurl-service
          - image-proxy-service
          - search-processing-service
          - proxy
          - sync-service
          - lexical-service
          - ai-editing-worker
          - analytics-proxy
          - websocket-service
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-tag the already-pushed :sha-<sha> image with the git tag, so version
      # tags never rebuild.
      - name: Add version tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:sha-${{ github.sha }}"
          VER_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${TAG}"
          # :sha-<sha> is pushed by the main-branch build. Wait briefly in case
          # that run is still finishing (tag pushed right after the commit).
          for i in $(seq 1 30); do
            if docker pull "$SHA_IMAGE" 2>/dev/null; then
              break
            fi
            echo "waiting for ${SHA_IMAGE} (attempt ${i}/30)..."
            sleep 20
          done
          docker pull "$SHA_IMAGE"
          docker tag "$SHA_IMAGE" "$VER_IMAGE"
          docker push "$VER_IMAGE"

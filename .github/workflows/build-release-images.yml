name: build-release-images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust services — docker/Dockerfile builds one binary per image via
          # the SERVICE_NAME build arg.
          - image: authentication-service
            bin: authentication_service
            file: docker/Dockerfile
          - image: connection-gateway
            bin: connection_gateway_service
            file: docker/Dockerfile
          - image: contacts-service
            bin: contacts_service
            file: docker/Dockerfile
          - image: document-cognition-service
            bin: document_cognition_service
            file: docker/Dockerfile
          - image: document-storage-service
            bin: document_storage_service
            file: docker/Dockerfile
          - image: document-upload-finalizer
            bin: document_upload_finalizer_local_worker
            file: docker/Dockerfile
          - image: email-service
            bin: email_service
            file: docker/Dockerfile
          - image: email-pubsub-workers
            bin: pubsub_workers
            file: docker/Dockerfile
          - image: notification-service
            bin: notification_service
            file: docker/Dockerfile
          - image: static-file-service
            bin: static_file_service
            file: docker/Dockerfile
          - image: unfurl-service
            bin: unfurl_service
            file: docker/Dockerfile
          - image: image-proxy-service
            bin: image_proxy_service
            file: docker/Dockerfile
          # search_processing_service needs pdfium (own Dockerfile; no SERVICE_NAME).
          - image: search-processing-service
            bin: search_processing_service
            file: docker/Dockerfile.search_processing_service
          # Frontend + Caddy reverse proxy.
          - image: proxy
            bin: proxy
            file: docker/selfhost/Dockerfile.proxy
          # JS/worker services — each has its own Dockerfile and no SERVICE_NAME
          # build arg (that arg only drives the Rust docker/Dockerfile).
          - image: sync-service
            file: docker/sync-service.Dockerfile
          - image: lexical-service
            file: docker/lexical-service.Dockerfile
          - image: ai-editing-worker
            file: docker/ai-editing-worker.Dockerfile
          - image: analytics-proxy
            file: docker/analytics-proxy.Dockerfile
          - image: websocket-service
            file: docker/websocket-service.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            SERVICE_NAME=${{ matrix.bin }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:latest
          # cargo-chef (docker/Dockerfile) turns the dependency compile into a
          # normal image layer, cached in GHCR via type=registry. Unlike type=gha
          # (GitHub Actions cache), the registry cache is ref-independent, so a
          # tag build restores the deps cached by the previous tag, and it has no
          # 10 GB cap. Rebuilds only recompile changed source.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/buildcache:${{ matrix.image }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/buildcache:${{ matrix.image }},mode=max

      # Flip the buildcache package to public so it doesn't consume private
      # GHCR storage quota (the repo is public; the cache holds only compiled
      # deps). Prefer GHCR_PAT because GITHUB_TOKEN can't always change package
      # visibility; fail soft so this never blocks a release.
      - name: Make buildcache public
        continue-on-error: true
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GHCR_PAT" ]; then
            export GH_TOKEN="$GHCR_PAT"
          fi
          gh api -X PATCH "user/packages/container/${{ github.event.repository.name }}%2Fbuildcache" \
            -f visibility=public

  # Tag versioned images only (no :latest) when a v* tag is pushed.
  version-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - authentication-service
          - connection-gateway
          - contacts-service
          - document-cognition-service
          - document-storage-service
          - document-upload-finalizer
          - email-service
          - email-pubsub-workers
          - notification-service
          - static-file-service
          - unfurl-service
          - image-proxy-service
          - search-processing-service
          - proxy
          - sync-service
          - lexical-service
          - ai-editing-worker
          - analytics-proxy
          - websocket-service
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-tag the already-pushed :sha-<sha> image with the git tag, so version
      # tags never rebuild.
      - name: Add version tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:sha-${{ github.sha }}"
          VER_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${TAG}"
          docker pull "$SHA_IMAGE"
          docker tag "$SHA_IMAGE" "$VER_IMAGE"
          docker push "$VER_IMAGE"

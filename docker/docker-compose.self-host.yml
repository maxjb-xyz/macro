# Operator overlay for the upstream local Compose topology.
#
# SUPERSEDED: use docker/selfhost/compose.production.yml for production
# lifecycle hardening (restart + logging + resource limits across all
# long-running services). This file only sets restart on the 8 stateful
# services and is kept for compatibility with older references.
#
# Usage:
#   docker compose --project-directory . \
#     -f compose.yml \
#     -f docker/docker-compose.self-host.yml up -d
#
# The base file owns the named data volumes. This file only changes container
# lifecycle behavior; it does not replace the upstream service graph.

services:
  postgres:
    restart: unless-stopped
    stop_grace_period: 60s
  redis:
    restart: unless-stopped
    stop_grace_period: 30s
  kafka:
    restart: unless-stopped
    stop_grace_period: 60s
  search:
    restart: unless-stopped
    stop_grace_period: 60s
  db:
    restart: unless-stopped
    stop_grace_period: 60s
  fusionauth:
    restart: unless-stopped
    stop_grace_period: 60s
  localstack:
    restart: unless-stopped
    stop_grace_period: 60s
  mailpit:
    restart: unless-stopped
    stop_grace_period: 30s

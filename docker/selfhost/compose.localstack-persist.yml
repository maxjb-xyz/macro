# Durable LocalStack state for self-host.
#
# The official LocalStack Community image does NOT persist state (`PERSISTENCE=1`
# is Pro-only), so S3/SQS/DynamoDB state is lost on container recreation. This
# swaps in the community-maintained `gresau/localstack-persist` fork (based on
# LocalStack 4.14) which persists state to a named volume.
#
# Verified: S3 objects, SQS queues, and DynamoDB tables/items all survive a full
# container recreation (tested against gresau/localstack-persist:4).
#
# Note: LocalStack moved to a closed-source model in March 2026, so both
# `localstack/localstack:4` and this fork are frozen at their last OSS release.
# The tag is pinned below on purpose. Real AWS S3/SQS/DynamoDB remains the
# production recommendation when an AWS account is available (GAP-ANALYSIS #3).
#
# Usage (append to the canonical invocation):
#   docker compose -f compose.yml -f docker/selfhost/compose.frontend.yml \
#     -f docker/selfhost/compose.localstack-persist.yml up -d

services:
  localstack:
    image: gresau/localstack-persist:4
    environment:
      # Persist S3, SQS, and DynamoDB state to the /persisted-data volume.
      PERSIST_DEFAULT: 1
    volumes:
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack_data:/persisted-data

volumes:
  localstack_data:
    name: macro_localstack_data

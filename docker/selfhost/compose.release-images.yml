# Release-image overrides — the final merge layer that turns the source stack
# into an immutable, pull-only production deployment.
#
# These are NOT applied by `docker compose` directly (Docker Compose's
# `include:` directive cannot override a service that an included file already
# defines — v2.24+ errors with "conflicts with imported resource", and older
# versions silently first-wins). Instead, tooling/selfhost/flatten-compose.py
# deep-merges these sources into a single self-contained `compose.yml` at the
# repo root, which operators deploy with a bare `docker compose up -d`.
#
# Source merge order (later wins):
#   1. docker/docker-compose-databases.yml
#   2. infra/stacks/fusionauth-instance/docker-compose.yml
#   3. docker/docker-compose.yml
#   4. docker/selfhost/compose.frontend.yml
#   5. docker/selfhost/compose.production.yml
#   6. docker/selfhost/compose.release-images.yml   <-- this file
#
# Every Macro service gets an immutable GHCR image. `build: !reset null` and
# `command: !reset null` drop the dev-time Dockerfile/CMD so Compose pulls the
# image and runs its baked-in entrypoint instead of building from source.

services:
  authentication-service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/authentication-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  connection_gateway:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/connection-gateway:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  contacts_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/contacts-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  document_cognition_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/document-cognition-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  document_storage_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/document-storage-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  document_upload_finalizer:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/document-upload-finalizer:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null
    # Published images rename the binary to /app/svc and run it as `./svc`, so
    # the base compose's liveness probe (which greps for the dev binary name
    # `document_upload_finalizer_local_worker`) must be overridden to match.
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'sv[c]' /proc/[0-9]*/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  email_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/email-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  email_pubsub_workers:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/email-pubsub-workers:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null
    # Same as document_upload_finalizer: base probe greps for dev name
    # `pubsub_workers`; published binary runs as `./svc`.
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'sv[c]' /proc/[0-9]*/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  notification_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/notification-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  static_file_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/static-file-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  unfurl_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/unfurl-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  image_proxy_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/image-proxy-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  search_processing_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/search-processing-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  proxy:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/proxy:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null

  # --- JS/worker services (own Dockerfiles; bundled/installed at build time) ---
  sync_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/sync-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    volumes: !reset []

  lexical_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/lexical-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    # The release image bundles at build time; drop the dev-time
    # `bun build ... && bun server.bundle.js` command.
    command: !reset null

  ai_editing_worker:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/ai-editing-worker:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    volumes: !reset []

  analytics_proxy:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/analytics-proxy:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    volumes: !reset []

  websocket_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/websocket-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null

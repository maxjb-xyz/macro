# Production-oriented overlay that replaces all host-built Rust dev images
# with immutable per-service release images from a registry.
#
# Prerequisites:
#   1. Build and push images (CI does this automatically on push to main; or
#      manually):
#        tooling/selfhost/build-release-images.sh \
#          --registry ghcr.io/my-org --tag v2026.4.28.0 --push
#   2. Set in your operator .env:
#        MACRO_RELEASE_IMAGE_REGISTRY=ghcr.io/maxjb-xyz/macro
#        MACRO_RELEASE_IMAGE_TAG=latest             # CI publishes :latest + :sha-<full-sha> on every main push
#        # MACRO_RELEASE_IMAGE_TAG=v2026.4.28.0     # or a version tag from a v* push
#
# Usage:
#   docker compose --project-directory . \
#     -f compose.yml \
#     -f docker/selfhost/compose.frontend.yml \
#     -f docker/selfhost/compose.published.yml \
#     --env-file .env up -d
#
# This overlay overrides every Rust HTTP service, worker, and the frontend
# proxy. The JS/worker services (sync_service, lexical_service,
# ai_editing_worker, analytics_proxy, websocket_service) are NOT covered yet;
# they keep their existing (wrangler-dev) Dockerfiles until dedicated release
# images are published.

services:
  authentication-service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY:?set MACRO_RELEASE_IMAGE_REGISTRY}/authentication-service:${MACRO_RELEASE_IMAGE_TAG:?set MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  connection_gateway:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/connection-gateway:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  contacts_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/contacts-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  document_cognition_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/document-cognition-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  document_storage_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/document-storage-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  document_upload_finalizer:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/document-upload-finalizer:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null
    # Published images rename the binary to /app/svc and run it as `./svc`, so
    # the base compose's liveness probe (which greps for the dev binary name
    # `document_upload_finalizer_local_worker`) must be overridden to match.
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'sv[c]' /proc/[0-9]*/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  email_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/email-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  email_pubsub_workers:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/email-pubsub-workers:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null
    # Same as document_upload_finalizer: base probe greps for dev name
    # `pubsub_workers`; published binary runs as `./svc`.
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'sv[c]' /proc/[0-9]*/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  notification_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/notification-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  static_file_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/static-file-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  unfurl_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/unfurl-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  image_proxy_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/image-proxy-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  search_processing_service:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/search-processing-service:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null
    command: !reset null

  proxy:
    image: ${MACRO_RELEASE_IMAGE_REGISTRY}/proxy:${MACRO_RELEASE_IMAGE_TAG}
    build: !reset null

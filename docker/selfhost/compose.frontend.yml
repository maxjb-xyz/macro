# Self-host overlay for Macro: frontend + reverse proxy + durable storage.
#
# Usage:
#   docker compose -f compose.yml -f docker/selfhost/compose.frontend.yml up -d
#
# What this overlay adds:
#
# 1. Caddy reverse proxy — serves the built frontend SPA at /app/ and routes
#    API calls to the correct backend services. Port 80 is the HTTP entrypoint;
#    port 443 is published for TLS when SELF_HOST_DOMAIN is set.
#
# 2. Durable object storage/queues — swaps the ephemeral LocalStack Community
#    image for gresau/localstack-persist:4 + a named volume, so S3/SQS/DynamoDB
#    state survives container recreation (verified). To use real AWS instead,
#    set LOCAL_AWS_URL="" and real AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in
#    .env — the localstack service then sits idle (see GAP-ANALYSIS #3).
#
# `service_healthy` is used only for services that define a healthcheck in the
# base compose. Worker services without a healthcheck use `service_started`.

services:
  proxy:
    build:
      context: .
      dockerfile: docker/selfhost/Dockerfile.proxy
    image: macro-selfhost-proxy:dev
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set this to a public domain to enable automatic Let's Encrypt HTTPS.
      # Default is plain HTTP on localhost (must be non-empty — Caddy's
      # {$VAR:default} only falls back when the var is UNSET, not empty).
      SELF_HOST_DOMAIN: ${SELF_HOST_DOMAIN:-http://localhost}
    networks:
      - services
      - databases
      - auth-internal
    depends_on:
      authentication-service:
        condition: service_healthy
      connection_gateway:
        condition: service_healthy
      document_storage_service:
        condition: service_healthy
      email_service:
        condition: service_healthy
      static_file_service:
        condition: service_healthy
      search_processing_service:
        condition: service_healthy
      notification_service:
        condition: service_healthy
      fusionauth:
        condition: service_healthy
      localstack:
        condition: service_healthy
      sync_service:
        condition: service_healthy
      lexical_service:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      websocket_service:
        condition: service_started
      ai_editing_worker:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Mailpit serves its UI under /mailpit so the proxy route (MP_WEBROOT) works.
  # The base compose starts it without a webroot (plain /).
  mailpit:
    environment:
      MP_WEBROOT: /mailpit

  # Durable LocalStack: the base compose runs the official LocalStack Community
  # image, which does NOT persist state. gresau/localstack-persist:4 is a
  # drop-in fork (LocalStack 4.14) that persists S3/SQS/DynamoDB to a named
  # volume. LocalStack moved to a closed-source model in March 2026, so both
  # images are frozen at their last OSS release — the tag is pinned on purpose.
  localstack:
    image: gresau/localstack-persist:4
    environment:
      # Persist S3, SQS, and DynamoDB state to the /persisted-data volume.
      PERSIST_DEFAULT: 1
    volumes:
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack_data:/persisted-data

  # One-shot: provision FusionAuth identity providers (Google/GitHub/Microsoft)
  # for every integration whose credentials are set in .env. Idempotent — each
  # IdP has a fixed Id and is created once, then updated on re-run. After
  # changing credentials, re-run with:
  #   docker compose -f compose.yml -f docker/selfhost/compose.frontend.yml \
  #     run --rm fusionauth_provision_idps
  fusionauth_provision_idps:
    image: python:3.12-alpine
    restart: "no"
    env_file:
      - path: ${MACRO_ENV_FILE:-.env}
        required: false
    volumes:
      - ./tooling/selfhost/provision_idps.py:/provision_idps.py:ro
      - ./infra/stacks/fusionauth-instance/templates/reconcile_secondary_idp_link.js:/reconcile_secondary_idp_link.js:ro
    command: ["python3", "/provision_idps.py"]
    depends_on:
      fusionauth:
        condition: service_healthy
    networks:
      - auth

volumes:
  localstack_data:
    name: macro_localstack_data
